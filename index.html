<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Studyshare website</title>

    <meta http-equiv="refresh" content="0; url=https://Studyshare.pythonanywhere.com/">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Sleek SumanOS Dark Theme for the split-second it is visible */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            color: #64748b;
            font-size: 1rem;
            font-weight: 500;
            margin: 0;
        }
        
        .fallback {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #475569;
        }
        
        .fallback a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .fallback a:hover {
            text-decoration: underline;
        }
    </style>

    <script>
        // .replace() means they can't click the "Back" button to get stuck in a redirect loop
        window.location.replace("https://studyshare.pythonanywhere.com/");
    </script>
</head>
<body>
    
    <div class="loader"></div>
    <h1>Initializing SumanOS...</h1>
    <p>Rerouting to secure server</p>
    
    <div class="fallback">
        Not redirecting automatically? <a href="https://studyshare.pythonanywhere.com/">Click here</a>.
    </div>

</body>
</html>
